
name: Build Hermes Agent Docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Hermes Agent
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Check GHCR token
      - name: Check GHCR Token
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::GHCR_TOKEN is missing"
            exit 1
          fi

          echo "GHCR_TOKEN is configured"

      # 4. Test GHCR authentication
      - name: Test GHCR Authentication
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          STATUS=$(curl -sS \
            --retry 2 \
            -o /dev/null \
            -w "%{http_code}" \
            -u "bubusky12:${GHCR_TOKEN}" \
            "https://ghcr.io/token?scope=repository:bubusky12/hermes-agent-pterodactyl:pull")

          echo "GHCR HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "::error::GHCR token request failed"
            exit 1
          fi

      # 5. Login to GHCR
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bubusky12
          password: ${{ secrets.GHCR_TOKEN }}

      # 6. Docker metadata
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bubusky12/hermes-agent-pterodactyl
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # 7. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 8. Build summary
      - name: Build Summary
        run: |
          echo "## Hermes Agent Docker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Docker image:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/bubusky12/hermes-agent-pterodactyl:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Build and push completed." >> "$GITHUB_STEP_SUMMARY"
